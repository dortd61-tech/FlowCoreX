name: Build FlowCoreX

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin
        run: mvn -B clean package

      - name: Upload FlowCoreX
        uses: actions/upload-artifact@v4
        with:
          name: FlowCoreX
          path: target/FlowCoreX-1.0.0.jar
